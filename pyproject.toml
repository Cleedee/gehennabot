[project]
name = "gehennabot"
version = "0.6.0"
description = ""
authors = [{ name = "Claudio Torcato", email = "claudiotorcato@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Pyrogram>=2.0.106,<3",
    "python-dotenv>=1.0.0,<2",
    "TgCrypto>=1.2.5,<2",
    "requests>=2.31.0,<3",
    "pyaes>=1.6.1,<2",
    "typer[all]>=0.9.0,<0.10",
    "rich>=13.5.2,<14",
    "masonite-orm==3.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0,<2",
    "taskipy>=1.12.0,<2",
    "blue>=0.9.1,<0.10",
    "isort>=5.12.0,<6",
    "ruff>=0.0.286,<0.0.287",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 79
exclude = ['.venv', 'migrations']

[tool.isort]
profile = "black"
line_length = 79

[tool.blue]
extend-exclude = '(migrations/)'

[tool.taskipy.tasks]
lint = 'ruff . && blue --check . --diff'
format = 'blue .  && isort .'
